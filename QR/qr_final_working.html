<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR碼生成器 - 最終工作版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
            margin: 10px 0;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .output-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            text-align: center;
            margin-top: 20px;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qrcode {
            display: inline-block;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin: 5px;
        }

        .download-btn:hover {
            transform: translateY(-1px);
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .examples {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .examples h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .example-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #dee2e6;
            transition: background-color 0.2s;
        }

        .example-item:hover {
            background: #f8f9fa;
        }

        .placeholder {
            color: #6c757d;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR碼生成器</h1>
            <p>最終工作版 - 真正可用的QR碼生成器</p>
        </div>

        <div class="content">
            <div class="form-group">
                <label for="qrType">QR碼類型</label>
                <select id="qrType" onchange="updateInputFields()">
                    <option value="text">文字</option>
                    <option value="url">網址</option>
                    <option value="wifi">WiFi</option>
                    <option value="email">郵件</option>
                    <option value="phone">電話</option>
                </select>
            </div>

            <div class="form-group">
                <label for="qrStyle">樣式</label>
                <select id="qrStyle">
                    <option value="standard">標準</option>
                    <option value="blue">藍色</option>
                    <option value="purple">紫色</option>
                    <option value="green">綠色</option>
                    <option value="red">紅色</option>
                </select>
            </div>

            <div id="inputFields">
                <div class="form-group">
                    <label for="qrData">內容</label>
                    <input type="text" id="qrData" placeholder="輸入要編碼的內容">
                </div>
            </div>

            <button class="btn" onclick="generateQR()">🚀 生成QR碼</button>
            
            <div class="status" id="statusMessage"></div>

            <div class="output-section" id="outputSection" style="display: none;">
                <h2>📱 QR碼預覽</h2>
                <div class="qr-container">
                    <div id="qrcode" class="placeholder">QR碼將在這裡顯示</div>
                </div>
                <button class="download-btn" onclick="downloadQR()">📥 下載PNG</button>
            </div>

            <div class="examples">
                <h3>💡 快速示例</h3>
                <div class="example-item" onclick="fillExample('text', 'Hello World!')">
                    📝 文字: Hello World!
                </div>
                <div class="example-item" onclick="fillExample('url', 'https://www.google.com')">
                    🌐 網址: https://www.google.com
                </div>
                <div class="example-item" onclick="fillExample('phone', '+886-912-345-678')">
                    📞 電話: +886-912-345-678
                </div>
                <div class="example-item" onclick="fillExample('email', 'test@example.com')">
                    📧 郵件: test@example.com
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQRData = null;
        let currentQRImage = null;

        // 更新輸入字段
        function updateInputFields() {
            const qrType = document.getElementById('qrType').value;
            const inputFields = document.getElementById('inputFields');
            let html = '';

            switch(qrType) {
                case 'text':
                    html = '<div class="form-group"><label for="qrData">文字內容</label><input type="text" id="qrData" placeholder="輸入要編碼的文字"></div>';
                    break;
                case 'url':
                    html = '<div class="form-group"><label for="qrData">網址</label><input type="url" id="qrData" placeholder="https://example.com"></div>';
                    break;
                case 'wifi':
                    html = `
                        <div class="form-group">
                            <label for="wifiSSID">WiFi名稱</label>
                            <input type="text" id="wifiSSID" placeholder="WiFi名稱">
                        </div>
                        <div class="form-group">
                            <label for="wifiPassword">密碼</label>
                            <input type="text" id="wifiPassword" placeholder="WiFi密碼">
                        </div>
                        <div class="form-group">
                            <label for="wifiSecurity">安全類型</label>
                            <select id="wifiSecurity">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">無密碼</option>
                            </select>
                        </div>
                    `;
                    break;
                case 'email':
                    html = `
                        <div class="form-group">
                            <label for="emailAddress">郵件地址</label>
                            <input type="email" id="emailAddress" placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label for="emailSubject">主題</label>
                            <input type="text" id="emailSubject" placeholder="郵件主題">
                        </div>
                        <div class="form-group">
                            <label for="emailBody">內容</label>
                            <textarea id="emailBody" placeholder="郵件內容"></textarea>
                        </div>
                    `;
                    break;
                case 'phone':
                    html = '<div class="form-group"><label for="qrData">電話號碼</label><input type="tel" id="qrData" placeholder="+886-912-345-678"></div>';
                    break;
            }

            inputFields.innerHTML = html;
        }

        // 填充示例
        function fillExample(type, data) {
            document.getElementById('qrType').value = type;
            updateInputFields();
            
            if (type === 'wifi') {
                document.getElementById('wifiSSID').value = 'MyWiFi';
                document.getElementById('wifiPassword').value = 'password123';
            } else if (type === 'email') {
                document.getElementById('emailAddress').value = data;
                document.getElementById('emailSubject').value = 'Hello';
                document.getElementById('emailBody').value = 'This is a test email';
            } else {
                document.getElementById('qrData').value = data;
            }
        }

        // 生成QR碼
        function generateQR() {
            const qrType = document.getElementById('qrType').value;
            const qrStyle = document.getElementById('qrStyle').value;
            let data = '';

            // 根據類型獲取數據
            switch(qrType) {
                case 'text':
                case 'url':
                case 'phone':
                    data = document.getElementById('qrData').value;
                    break;
                case 'wifi':
                    const ssid = document.getElementById('wifiSSID').value;
                    const password = document.getElementById('wifiPassword').value;
                    const security = document.getElementById('wifiSecurity').value;
                    if (!ssid.trim()) {
                        showStatus('請輸入WiFi名稱', 'error');
                        return;
                    }
                    data = `WIFI:T:${security};S:${ssid};P:${password};H:false;;`;
                    break;
                case 'email':
                    const email = document.getElementById('emailAddress').value;
                    const subject = document.getElementById('emailSubject').value;
                    const body = document.getElementById('emailBody').value;
                    if (!email.trim()) {
                        showStatus('請輸入郵件地址', 'error');
                        return;
                    }
                    data = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    break;
            }

            if (!data.trim()) {
                showStatus('請輸入要編碼的內容', 'error');
                return;
            }

            showStatus('正在生成QR碼...', 'success');

            // 使用多個QR碼API作為備選
            const apis = [
                `https://api.qrserver.com/v1/create-qr-code/?size=256x256&data=${encodeURIComponent(data)}`,
                `https://chart.googleapis.com/chart?chs=256x256&cht=qr&chl=${encodeURIComponent(data)}`,
                `https://quickchart.io/qr?text=${encodeURIComponent(data)}&size=256`
            ];

            let currentApiIndex = 0;

            function tryNextApi() {
                if (currentApiIndex >= apis.length) {
                    showStatus('所有QR碼服務都無法使用，請檢查網絡連接', 'error');
                    return;
                }

                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = function() {
                    // 成功載入
                    const container = document.getElementById('qrcode');
                    container.innerHTML = '';
                    container.appendChild(img);
                    
                    currentQRData = data;
                    currentQRImage = img;
                    document.getElementById('outputSection').style.display = 'block';
                    showStatus('QR碼生成成功！', 'success');
                };

                img.onerror = function() {
                    // 失敗，嘗試下一個API
                    currentApiIndex++;
                    tryNextApi();
                };

                img.src = apis[currentApiIndex];
            }

            tryNextApi();
        }

        // 下載PNG
        function downloadQR() {
            if (!currentQRImage) {
                showStatus('沒有可下載的QR碼', 'error');
                return;
            }

            try {
                // 創建canvas來轉換圖片
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 256;

                // 繪製圖片到canvas
                ctx.drawImage(currentQRImage, 0, 0, 256, 256);

                // 創建下載鏈接
                const link = document.createElement('a');
                link.download = `qrcode_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                
                // 觸發下載
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showStatus('QR碼已下載到您的下載文件夾！', 'success');
            } catch (error) {
                showStatus('下載失敗: ' + error.message, 'error');
            }
        }

        // 顯示狀態消息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateInputFields();
            showStatus('QR碼生成器已就緒！', 'success');
        });
    </script>
</body>
</html>
