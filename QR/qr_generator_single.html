<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR碼生成器 - 單頁版</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .input-section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .output-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            text-align: center;
        }

        .output-section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 500;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #qrcode {
            display: inline-block;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 5px;
        }

        .download-btn:hover {
            transform: translateY(-1px);
        }

        .batch-section {
            grid-column: 1 / -1;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            margin-top: 20px;
        }

        .batch-section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 500;
        }

        .batch-input {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .batch-list {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
        }

        .batch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .batch-item button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .batch-item button:hover {
            background: #c82333;
        }

        .features {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .feature-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #e9ecef;
        }

        .feature-card h3 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .feature-card p {
            color: #6c757d;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .file-upload {
            background: #e9ecef;
            border: 2px dashed #6c757d;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 10px 0;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .file-upload:hover {
            border-color: #667eea;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .batch-input {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR碼生成器</h1>
            <p>單頁版 - 無需服務器，直接在瀏覽器中使用</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2>📝 生成QR碼</h2>
                
                <div class="form-group">
                    <label for="qrType">QR碼類型</label>
                    <select id="qrType" onchange="updateInputFields()">
                        <option value="text">文字</option>
                        <option value="url">網址</option>
                        <option value="wifi">WiFi</option>
                        <option value="email">郵件</option>
                        <option value="sms">簡訊</option>
                        <option value="phone">電話</option>
                        <option value="contact">聯絡人</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qrStyle">樣式</label>
                    <select id="qrStyle">
                        <option value="standard">標準</option>
                        <option value="rounded">圓角</option>
                        <option value="gradient">漸變</option>
                    </select>
                </div>

                <div id="inputFields">
                    <div class="form-group">
                        <label for="qrData">內容</label>
                        <input type="text" id="qrData" placeholder="輸入要編碼的內容">
                    </div>
                </div>

                <button class="btn" onclick="generateQR()">🚀 生成QR碼</button>
                
                <div class="success-message" id="successMessage"></div>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <div class="output-section">
                <h2>📱 QR碼預覽</h2>
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>生成中...</p>
                </div>
                <button class="download-btn" onclick="downloadQR()" id="downloadBtn" style="display: none;">📥 下載PNG</button>
                <button class="download-btn" onclick="downloadSVG()" id="downloadSvgBtn" style="display: none;">📥 下載SVG</button>
            </div>
        </div>

        <div class="batch-section">
            <h2>📦 批量生成</h2>
            
            <!-- 文件上傳區域 -->
            <div class="file-upload" onclick="document.getElementById('fileUpload').click()">
                <input type="file" id="fileUpload" accept=".txt,.csv" onchange="handleFileUpload()">
                <p>📁 點擊上傳文件 (TXT, CSV)</p>
                <small>或拖拽文件到此處</small>
            </div>
            
            <div class="batch-input">
                <input type="text" id="batchInput" placeholder="輸入要批量生成的內容，每行一個">
                <button class="btn" onclick="addToBatch()" style="width: auto; margin: 0;">➕ 添加</button>
            </div>
            <div class="batch-list" id="batchList">
                <p style="text-align: center; color: #6c757d; margin-top: 50px;">批量列表為空，請添加內容或上傳文件</p>
            </div>
            <button class="btn" onclick="generateBatch()" style="margin-top: 15px;">🚀 批量生成所有QR碼</button>
            <button class="btn" onclick="clearBatch()" style="margin-top: 15px; background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">🗑️ 清空列表</button>
        </div>

        <div class="features">
            <div class="feature-card">
                <h3>🎨 多種樣式</h3>
                <p>支持標準、圓角、漸變等多種視覺樣式，讓您的QR碼更加美觀</p>
            </div>
            <div class="feature-card">
                <h3>📱 多種類型</h3>
                <p>支持文字、網址、WiFi、郵件、簡訊、電話、聯絡人等各種類型</p>
            </div>
            <div class="feature-card">
                <h3>📦 批量處理</h3>
                <p>一次生成多個QR碼，提高工作效率，支持文件上傳</p>
            </div>
            <div class="feature-card">
                <h3>💾 多格式下載</h3>
                <p>支持PNG和SVG格式下載，滿足不同使用需求</p>
            </div>
        </div>
    </div>

    <script>
        let currentQRData = null;
        let batchItems = [];

        // 更新輸入字段
        function updateInputFields() {
            const qrType = document.getElementById('qrType').value;
            const inputFields = document.getElementById('inputFields');
            let html = '';

            switch(qrType) {
                case 'text':
                    html = '<div class="form-group"><label for="qrData">文字內容</label><input type="text" id="qrData" placeholder="輸入要編碼的文字"></div>';
                    break;
                case 'url':
                    html = '<div class="form-group"><label for="qrData">網址</label><input type="url" id="qrData" placeholder="https://example.com"></div>';
                    break;
                case 'wifi':
                    html = `
                        <div class="form-group">
                            <label for="wifiSSID">WiFi名稱</label>
                            <input type="text" id="wifiSSID" placeholder="WiFi名稱">
                        </div>
                        <div class="form-group">
                            <label for="wifiPassword">密碼</label>
                            <input type="text" id="wifiPassword" placeholder="WiFi密碼">
                        </div>
                        <div class="form-group">
                            <label for="wifiSecurity">安全類型</label>
                            <select id="wifiSecurity">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">無密碼</option>
                            </select>
                        </div>
                    `;
                    break;
                case 'email':
                    html = `
                        <div class="form-group">
                            <label for="emailAddress">郵件地址</label>
                            <input type="email" id="emailAddress" placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label for="emailSubject">主題</label>
                            <input type="text" id="emailSubject" placeholder="郵件主題">
                        </div>
                        <div class="form-group">
                            <label for="emailBody">內容</label>
                            <textarea id="emailBody" placeholder="郵件內容"></textarea>
                        </div>
                    `;
                    break;
                case 'sms':
                    html = `
                        <div class="form-group">
                            <label for="smsPhone">電話號碼</label>
                            <input type="tel" id="smsPhone" placeholder="+886-912-345-678">
                        </div>
                        <div class="form-group">
                            <label for="smsMessage">簡訊內容</label>
                            <textarea id="smsMessage" placeholder="簡訊內容"></textarea>
                        </div>
                    `;
                    break;
                case 'phone':
                    html = '<div class="form-group"><label for="qrData">電話號碼</label><input type="tel" id="qrData" placeholder="+886-912-345-678"></div>';
                    break;
                case 'contact':
                    html = `
                        <div class="form-group">
                            <label for="contactName">姓名</label>
                            <input type="text" id="contactName" placeholder="姓名">
                        </div>
                        <div class="form-group">
                            <label for="contactPhone">電話</label>
                            <input type="tel" id="contactPhone" placeholder="+886-912-345-678">
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">郵件</label>
                            <input type="email" id="contactEmail" placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label for="contactOrg">組織</label>
                            <input type="text" id="contactOrg" placeholder="公司或組織名稱">
                        </div>
                    `;
                    break;
            }

            inputFields.innerHTML = html;
        }

        // 生成QR碼
        function generateQR() {
            const qrType = document.getElementById('qrType').value;
            const qrStyle = document.getElementById('qrStyle').value;
            let data = '';

            // 根據類型獲取數據
            switch(qrType) {
                case 'text':
                case 'url':
                case 'phone':
                    data = document.getElementById('qrData').value;
                    break;
                case 'wifi':
                    const ssid = document.getElementById('wifiSSID').value;
                    const password = document.getElementById('wifiPassword').value;
                    const security = document.getElementById('wifiSecurity').value;
                    data = `WIFI:T:${security};S:${ssid};P:${password};H:false;;`;
                    break;
                case 'email':
                    const email = document.getElementById('emailAddress').value;
                    const subject = document.getElementById('emailSubject').value;
                    const body = document.getElementById('emailBody').value;
                    data = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    break;
                case 'sms':
                    const phone = document.getElementById('smsPhone').value;
                    const message = document.getElementById('smsMessage').value;
                    data = `sms:${phone}:${message}`;
                    break;
                case 'contact':
                    const name = document.getElementById('contactName').value;
                    const contactPhone = document.getElementById('contactPhone').value;
                    const contactEmail = document.getElementById('contactEmail').value;
                    const org = document.getElementById('contactOrg').value;
                    data = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTEL:${contactPhone}\nEMAIL:${contactEmail}\nEND:VCARD`;
                    break;
            }

            if (!data.trim()) {
                showError('請輸入要編碼的內容');
                return;
            }

            // 顯示加載動畫
            document.getElementById('loading').style.display = 'block';
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('downloadSvgBtn').style.display = 'none';

            // 生成QR碼
            const options = {
                width: 256,
                margin: 2,
                color: {
                    dark: qrStyle === 'standard' ? '#000000' : 
                          qrStyle === 'rounded' ? '#4285f4' : '#8e24aa',
                    light: '#FFFFFF'
                }
            };

            QRCode.toCanvas(document.getElementById('qrcode'), data, options, function (error) {
                document.getElementById('loading').style.display = 'none';
                
                if (error) {
                    showError('生成QR碼失敗: ' + error.message);
                    return;
                }

                currentQRData = data;
                document.getElementById('downloadBtn').style.display = 'inline-block';
                document.getElementById('downloadSvgBtn').style.display = 'inline-block';
                showSuccess('QR碼生成成功！');
            });
        }

        // 下載PNG
        function downloadQR() {
            if (!currentQRData) return;

            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = `qrcode_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // 下載SVG
        function downloadSVG() {
            if (!currentQRData) return;

            QRCode.toString(currentQRData, { type: 'svg' }, function (err, string) {
                if (err) {
                    showError('生成SVG失敗');
                    return;
                }

                const blob = new Blob([string], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `qrcode_${Date.now()}.svg`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        }

        // 添加到批量列表
        function addToBatch() {
            const input = document.getElementById('batchInput');
            const text = input.value.trim();
            
            if (!text) {
                showError('請輸入要添加的內容');
                return;
            }

            batchItems.push({
                id: Date.now(),
                text: text,
                type: document.getElementById('qrType').value,
                style: document.getElementById('qrStyle').value
            });

            updateBatchList();
            input.value = '';
            showSuccess('已添加到批量列表');
        }

        // 更新批量列表顯示
        function updateBatchList() {
            const batchList = document.getElementById('batchList');
            
            if (batchItems.length === 0) {
                batchList.innerHTML = '<p style="text-align: center; color: #6c757d; margin-top: 50px;">批量列表為空，請添加內容或上傳文件</p>';
                return;
            }

            batchList.innerHTML = batchItems.map(item => `
                <div class="batch-item">
                    <span>${item.text}</span>
                    <button onclick="removeFromBatch(${item.id})">刪除</button>
                </div>
            `).join('');
        }

        // 從批量列表移除
        function removeFromBatch(id) {
            batchItems = batchItems.filter(item => item.id !== id);
            updateBatchList();
        }

        // 處理文件上傳
        function handleFileUpload() {
            const fileInput = document.getElementById('fileUpload');
            const file = fileInput.files[0];
            
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n');
                
                // 清空現有列表
                batchItems = [];
                
                // 添加解析的項目
                lines.forEach(line => {
                    line = line.trim();
                    if (line) {
                        batchItems.push({
                            id: Date.now() + Math.random(),
                            text: line,
                            type: 'text',
                            style: 'standard'
                        });
                    }
                });
                
                updateBatchList();
                showSuccess(`成功載入 ${batchItems.length} 個項目`);
            };
            
            reader.readAsText(file);
        }

        // 清空批量列表
        function clearBatch() {
            batchItems = [];
            updateBatchList();
            showSuccess('批量列表已清空');
        }

        // 批量生成
        function generateBatch() {
            if (batchItems.length === 0) {
                showError('批量列表為空');
                return;
            }

            showSuccess(`開始批量生成 ${batchItems.length} 個QR碼...`);
            
            batchItems.forEach((item, index) => {
                setTimeout(() => {
                    generateBatchItem(item, index);
                }, index * 500); // 延遲生成，避免瀏覽器卡頓
            });
        }

        // 生成單個批量項目
        function generateBatchItem(item, index) {
            const options = {
                width: 256,
                margin: 2,
                color: {
                    dark: item.style === 'standard' ? '#000000' : 
                          item.style === 'rounded' ? '#4285f4' : '#8e24aa',
                    light: '#FFFFFF'
                }
            };

            QRCode.toCanvas(document.createElement('canvas'), item.text, options, function (error, canvas) {
                if (error) {
                    console.error('生成失敗:', item.text, error);
                    return;
                }

                // 下載生成的QR碼
                const link = document.createElement('a');
                link.download = `qrcode_batch_${index + 1}_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // 顯示成功消息
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // 顯示錯誤消息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateInputFields();
            
            // 添加拖拽上傳功能
            const fileUpload = document.querySelector('.file-upload');
            
            fileUpload.addEventListener('dragover', function(e) {
                e.preventDefault();
                fileUpload.style.borderColor = '#667eea';
            });
            
            fileUpload.addEventListener('dragleave', function(e) {
                e.preventDefault();
                fileUpload.style.borderColor = '#6c757d';
            });
            
            fileUpload.addEventListener('drop', function(e) {
                e.preventDefault();
                fileUpload.style.borderColor = '#6c757d';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    document.getElementById('fileUpload').files = files;
                    handleFileUpload();
                }
            });
        });
    </script>
</body>
</html>
