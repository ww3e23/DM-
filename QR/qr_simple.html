<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR碼生成器 - 簡化版</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        // 備用QRCode庫載入
        if (typeof QRCode === 'undefined') {
            console.log('主要QRCode庫載入失敗，嘗試備用庫...');
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js';
            script.onload = function() {
                console.log('備用QRCode庫載入成功');
            };
            script.onerror = function() {
                console.error('所有QRCode庫載入失敗');
            };
            document.head.appendChild(script);
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
            margin: 10px 0;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            text-align: center;
            margin-top: 20px;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #qrcode {
            display: inline-block;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin: 5px;
        }

        .download-btn:hover {
            transform: translateY(-1px);
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .examples {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .examples h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .example-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #dee2e6;
            transition: background-color 0.2s;
        }

        .example-item:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR碼生成器</h1>
            <p>簡化版 - 快速生成QR碼</p>
        </div>

        <div class="content">
            <div class="form-group">
                <label for="qrType">QR碼類型</label>
                <select id="qrType" onchange="updateInputFields()">
                    <option value="text">文字</option>
                    <option value="url">網址</option>
                    <option value="wifi">WiFi</option>
                    <option value="email">郵件</option>
                    <option value="phone">電話</option>
                </select>
            </div>

            <div class="form-group">
                <label for="qrStyle">樣式</label>
                <select id="qrStyle">
                    <option value="standard">標準</option>
                    <option value="blue">藍色</option>
                    <option value="purple">紫色</option>
                    <option value="green">綠色</option>
                    <option value="red">紅色</option>
                </select>
            </div>

            <div id="inputFields">
                <div class="form-group">
                    <label for="qrData">內容</label>
                    <input type="text" id="qrData" placeholder="輸入要編碼的內容">
                </div>
            </div>

            <button class="btn" onclick="generateQR()" id="generateBtn">🚀 生成QR碼</button>
            
            <div class="status" id="statusMessage"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>生成中...</p>
            </div>

            <div class="output-section" id="outputSection" style="display: none;">
                <h2>📱 QR碼預覽</h2>
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
                <button class="download-btn" onclick="downloadQR()">📥 下載PNG</button>
                <button class="download-btn" onclick="downloadSVG()">📥 下載SVG</button>
            </div>

            <div class="examples">
                <h3>💡 快速示例</h3>
                <div class="example-item" onclick="fillExample('text', 'Hello World!')">
                    📝 文字: Hello World!
                </div>
                <div class="example-item" onclick="fillExample('url', 'https://www.google.com')">
                    🌐 網址: https://www.google.com
                </div>
                <div class="example-item" onclick="fillExample('phone', '+886-912-345-678')">
                    📞 電話: +886-912-345-678
                </div>
                <div class="example-item" onclick="fillExample('email', 'test@example.com')">
                    📧 郵件: test@example.com
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQRData = null;

        // 更新輸入字段
        function updateInputFields() {
            const qrType = document.getElementById('qrType').value;
            const inputFields = document.getElementById('inputFields');
            let html = '';

            switch(qrType) {
                case 'text':
                    html = '<div class="form-group"><label for="qrData">文字內容</label><input type="text" id="qrData" placeholder="輸入要編碼的文字"></div>';
                    break;
                case 'url':
                    html = '<div class="form-group"><label for="qrData">網址</label><input type="url" id="qrData" placeholder="https://example.com"></div>';
                    break;
                case 'wifi':
                    html = `
                        <div class="form-group">
                            <label for="wifiSSID">WiFi名稱</label>
                            <input type="text" id="wifiSSID" placeholder="WiFi名稱">
                        </div>
                        <div class="form-group">
                            <label for="wifiPassword">密碼</label>
                            <input type="text" id="wifiPassword" placeholder="WiFi密碼">
                        </div>
                        <div class="form-group">
                            <label for="wifiSecurity">安全類型</label>
                            <select id="wifiSecurity">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">無密碼</option>
                            </select>
                        </div>
                    `;
                    break;
                case 'email':
                    html = `
                        <div class="form-group">
                            <label for="emailAddress">郵件地址</label>
                            <input type="email" id="emailAddress" placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label for="emailSubject">主題</label>
                            <input type="text" id="emailSubject" placeholder="郵件主題">
                        </div>
                        <div class="form-group">
                            <label for="emailBody">內容</label>
                            <textarea id="emailBody" placeholder="郵件內容"></textarea>
                        </div>
                    `;
                    break;
                case 'phone':
                    html = '<div class="form-group"><label for="qrData">電話號碼</label><input type="tel" id="qrData" placeholder="+886-912-345-678"></div>';
                    break;
            }

            inputFields.innerHTML = html;
        }

        // 填充示例
        function fillExample(type, data) {
            document.getElementById('qrType').value = type;
            updateInputFields();
            
            if (type === 'wifi') {
                document.getElementById('wifiSSID').value = 'MyWiFi';
                document.getElementById('wifiPassword').value = 'password123';
            } else if (type === 'email') {
                document.getElementById('emailAddress').value = data;
                document.getElementById('emailSubject').value = 'Hello';
                document.getElementById('emailBody').value = 'This is a test email';
            } else {
                document.getElementById('qrData').value = data;
            }
        }

        // 生成QR碼
        function generateQR() {
            const qrType = document.getElementById('qrType').value;
            const qrStyle = document.getElementById('qrStyle').value;
            let data = '';

            // 根據類型獲取數據
            switch(qrType) {
                case 'text':
                case 'url':
                case 'phone':
                    data = document.getElementById('qrData').value;
                    break;
                case 'wifi':
                    const ssid = document.getElementById('wifiSSID').value;
                    const password = document.getElementById('wifiPassword').value;
                    const security = document.getElementById('wifiSecurity').value;
                    if (!ssid.trim()) {
                        showStatus('請輸入WiFi名稱', 'error');
                        return;
                    }
                    data = `WIFI:T:${security};S:${ssid};P:${password};H:false;;`;
                    break;
                case 'email':
                    const email = document.getElementById('emailAddress').value;
                    const subject = document.getElementById('emailSubject').value;
                    const body = document.getElementById('emailBody').value;
                    if (!email.trim()) {
                        showStatus('請輸入郵件地址', 'error');
                        return;
                    }
                    data = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    break;
            }

            if (!data.trim()) {
                showStatus('請輸入要編碼的內容', 'error');
                return;
            }

            // 顯示加載動畫
            showLoading(true);
            hideStatus();
            document.getElementById('outputSection').style.display = 'none';

            // 根據樣式選擇顏色
            let color = '#000000';
            switch(qrStyle) {
                case 'blue':
                    color = '#4285f4';
                    break;
                case 'purple':
                    color = '#8e24aa';
                    break;
                case 'green':
                    color = '#28a745';
                    break;
                case 'red':
                    color = '#dc3545';
                    break;
                default:
                    color = '#000000';
            }

            // 生成QR碼
            const options = {
                width: 256,
                margin: 2,
                color: {
                    dark: color,
                    light: '#FFFFFF'
                }
            };

            // 清空之前的QR碼
            document.getElementById('qrcode').innerHTML = '';

            // 檢查QRCode庫是否載入
            if (typeof QRCode === 'undefined') {
                showLoading(false);
                showStatus('QRCode庫載入失敗，請刷新頁面重試', 'error');
                return;
            }

            try {
                QRCode.toCanvas(document.getElementById('qrcode'), data, options, function (error) {
                    showLoading(false);
                    
                    if (error) {
                        console.error('QR碼生成錯誤:', error);
                        showStatus('生成QR碼失敗: ' + error.message, 'error');
                        return;
                    }

                    currentQRData = data;
                    document.getElementById('outputSection').style.display = 'block';
                    showStatus('QR碼生成成功！', 'success');
                });
            } catch (error) {
                showLoading(false);
                console.error('QR碼生成異常:', error);
                showStatus('生成QR碼失敗: ' + error.message, 'error');
            }
        }

        // 下載PNG
        function downloadQR() {
            if (!currentQRData) return;

            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = `qrcode_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // 下載SVG
        function downloadSVG() {
            if (!currentQRData) return;

            QRCode.toString(currentQRData, { type: 'svg' }, function (err, string) {
                if (err) {
                    showStatus('生成SVG失敗', 'error');
                    return;
                }

                const blob = new Blob([string], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `qrcode_${Date.now()}.svg`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            });
        }

        // 顯示加載動畫
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('generateBtn').disabled = show;
        }

        // 顯示狀態消息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // 隱藏狀態消息
        function hideStatus() {
            document.getElementById('statusMessage').style.display = 'none';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateInputFields();
            
            // 檢查QRCode庫是否載入
            setTimeout(function() {
                if (typeof QRCode !== 'undefined') {
                    showStatus('QR碼生成器已就緒！', 'success');
                } else {
                    showStatus('QRCode庫載入中，請稍候...', 'error');
                    // 再次檢查
                    setTimeout(function() {
                        if (typeof QRCode !== 'undefined') {
                            showStatus('QR碼生成器已就緒！', 'success');
                        } else {
                            showStatus('QRCode庫載入失敗，請檢查網絡連接或刷新頁面', 'error');
                        }
                    }, 3000);
                }
            }, 1000);
        });
    </script>
</body>
</html>
