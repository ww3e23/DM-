<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM 生產器 - 測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <!-- 頂部藍條 -->
  <div class="bg-blue-100 border-b border-blue-200 py-2 px-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="text-sm text-blue-800 font-medium">DM 生產器</div>
      <div class="flex items-center gap-3">
        <span id="usage-display" class="text-xs text-blue-600">剩餘 3 次</span>
        <span id="login-state" class="text-xs text-blue-600">未登入</span>
        <button id="show-login-modal" class="px-3 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700">登入</button>
        <button id="show-register-modal" class="px-3 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700">註冊</button>
      </div>
    </div>
  </div>

  <div class="min-h-screen flex flex-col gap-4 p-4 max-w-4xl mx-auto">
    <!-- 左：商品庫 / 匯入 / 模板選擇 -->
    <aside class="space-y-4">
      <div class="bg-white rounded-2xl shadow p-4">
        <div class="flex flex-wrap items-center gap-2">
          <div class="grow"></div>
          <button id="reset-data" class="px-2 py-1 rounded-lg border text-xs">重置本機資料</button>
        </div>
      </div>

      <!-- 新增：店家與 DM 卡片 -->
      <div class="bg-white rounded-2xl shadow p-4">
        <h2 class="text-lg font-bold mb-3">店家與 DM</h2>
        <div class="space-y-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-sm text-slate-600">店家選擇（必選）</label>
              <button class="px-2 py-1 rounded-lg border text-xs">＋新增店家</button>
            </div>
            <div class="text-sm text-gray-500">請選擇或新增店家</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 中：商品列表 -->
    <section class="bg-white rounded-2xl shadow overflow-hidden">
      <div class="p-4">
        <h2 class="text-lg font-bold mb-3">商品庫</h2>
        <div class="text-sm text-gray-500">商品列表將在這裡顯示</div>
      </div>
    </section>

    <!-- 右：DM 預覽 -->
    <section class="bg-white rounded-2xl shadow overflow-hidden">
      <div class="p-4">
        <h2 class="text-lg font-bold mb-3">DM 預覽</h2>
        <div class="text-sm text-gray-500">DM 預覽將在這裡顯示</div>
      </div>
    </section>
  </div>

  <script>
    console.log('測試頁面載入完成');
  </script>
</body>
</html>
