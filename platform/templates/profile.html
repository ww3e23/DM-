{% extends "base.html" %}

{% block title %}个人资料 - 整合平台{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8" x-data="profile()">
    <!-- 页面标题 -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">个人资料</h1>
        <p class="text-gray-600">管理您的账户信息和设置</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 左侧：个人信息 -->
        <div class="lg:col-span-2">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <h3 class="text-lg font-bold text-gray-900 mb-6">基本信息</h3>
                
                <form @submit.prevent="updateProfile">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                            <input 
                                type="text" 
                                x-model="profileData.username"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                readonly>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
                            <input 
                                type="email" 
                                x-model="profileData.email"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <button 
                            type="submit"
                            :disabled="loading"
                            class="bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white py-2 px-6 rounded-lg font-medium transition-colors">
                            <i class="fas fa-save mr-2" :class="{'animate-spin': loading}"></i>
                            <span x-text="loading ? '保存中...' : '保存更改'"></span>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- 密码修改 -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 mt-6">
                <h3 class="text-lg font-bold text-gray-900 mb-6">修改密码</h3>
                
                <form @submit.prevent="changePassword">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">当前密码</label>
                            <input 
                                type="password" 
                                x-model="passwordData.current"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">新密码</label>
                            <input 
                                type="password" 
                                x-model="passwordData.new"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">确认新密码</label>
                            <input 
                                type="password" 
                                x-model="passwordData.confirm"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <button 
                            type="submit"
                            :disabled="passwordLoading"
                            class="bg-green-500 hover:bg-green-600 disabled:bg-gray-400 text-white py-2 px-6 rounded-lg font-medium transition-colors">
                            <i class="fas fa-key mr-2" :class="{'animate-spin': passwordLoading}"></i>
                            <span x-text="passwordLoading ? '修改中...' : '修改密码'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 右侧：账户信息 -->
        <div class="lg:col-span-1">
            <!-- 当前方案 -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 mb-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4">当前方案</h3>
                
                <div class="text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-crown text-blue-600 text-2xl"></i>
                    </div>
                    <h4 class="text-xl font-bold text-gray-900 mb-2" x-text="getPlanName(stats.plan_type)"></h4>
                    <p class="text-gray-600 mb-4" x-text="getPlanDescription(stats.plan_type)"></p>
                    
                    <div class="space-y-2 text-sm text-gray-600 mb-4">
                        <div>DM生成：<span x-text="stats.dm_monthly_limit"></span>次/月</div>
                        <div>QR生成：<span x-text="stats.qr_monthly_limit"></span>次/月</div>
                    </div>
                    
                    <button 
                        @click="upgradePlan"
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg font-medium transition-colors">
                        升级方案
                    </button>
                </div>
            </div>
            
            <!-- 使用统计 -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 mb-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4">使用统计</h3>
                
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-medium text-gray-700">DM生成</span>
                            <span class="text-sm text-gray-500" x-text="stats.dm_usage_count + '/' + stats.dm_monthly_limit"></span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" 
                                 :style="'width: ' + getUsagePercentage(stats.dm_usage_count, stats.dm_monthly_limit) + '%'"></div>
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-medium text-gray-700">QR生成</span>
                            <span class="text-sm text-gray-500" x-text="stats.qr_usage_count + '/' + stats.qr_monthly_limit"></span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-green-600 h-2 rounded-full transition-all duration-300" 
                                 :style="'width: ' + getUsagePercentage(stats.qr_usage_count, stats.qr_monthly_limit) + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 账户状态 -->
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <h3 class="text-lg font-bold text-gray-900 mb-4">账户状态</h3>
                
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">注册时间</span>
                        <span class="text-sm font-medium text-gray-900" x-text="formatDate(stats.created_at)"></span>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">最后登录</span>
                        <span class="text-sm font-medium text-gray-900">刚刚</span>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">账户状态</span>
                        <span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full">活跃</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function profile() {
    return {
        profileData: {
            username: '',
            email: ''
        },
        passwordData: {
            current: '',
            new: '',
            confirm: ''
        },
        stats: {},
        loading: false,
        passwordLoading: false,
        
        async init() {
            await this.loadProfile();
        },
        
        async loadProfile() {
            try {
                const response = await fetch('/api/user/stats');
                const data = await response.json();
                this.stats = data;
                this.profileData = {
                    username: data.username,
                    email: data.email
                };
            } catch (error) {
                console.error('加载个人资料失败:', error);
            }
        },
        
        async updateProfile() {
            this.loading = true;
            
            try {
                // 这里应该调用API来更新个人资料
                showToast('个人资料更新功能开发中...', 'info');
            } catch (error) {
                showToast('更新失败', 'error');
            } finally {
                this.loading = false;
            }
        },
        
        async changePassword() {
            if (this.passwordData.new !== this.passwordData.confirm) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }
            
            if (this.passwordData.new.length < 6) {
                showToast('密码长度至少6位', 'error');
                return;
            }
            
            this.passwordLoading = true;
            
            try {
                // 这里应该调用API来修改密码
                showToast('密码修改功能开发中...', 'info');
                
                // 清空表单
                this.passwordData = {
                    current: '',
                    new: '',
                    confirm: ''
                };
            } catch (error) {
                showToast('修改失败', 'error');
            } finally {
                this.passwordLoading = false;
            }
        },
        
        getPlanName(planType) {
            const plans = {
                'free': '免费方案',
                'basic': '基础方案',
                'premium': '高级方案',
                'enterprise': '企业方案'
            };
            return plans[planType] || '未知方案';
        },
        
        getPlanDescription(planType) {
            const descriptions = {
                'free': '适合个人用户试用',
                'basic': '适合小型团队',
                'premium': '适合中型企业',
                'enterprise': '适合大型企业'
            };
            return descriptions[planType] || '';
        },
        
        getUsagePercentage(used, total) {
            if (!total || total === 0) return 0;
            return Math.min(Math.round((used / total) * 100), 100);
        },
        
        formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        },
        
        upgradePlan() {
            showToast('方案升级功能开发中...', 'info');
        }
    }
}
</script>
{% endblock %}
