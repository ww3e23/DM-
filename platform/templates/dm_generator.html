{% extends "base.html" %}

{% block title %}DM生成器 - 整合平台{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8" x-data="dmGenerator()">
    <!-- 页面标题 -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">DM自动生产器</h1>
        <p class="text-gray-600">智能生成精美的DM内容，支持多种模板和自定义样式</p>
    </div>
    
    <!-- 使用限制提示 -->
    <div x-show="usageLimitReached" class="mb-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
        <div class="flex items-center">
            <i class="fas fa-exclamation-triangle text-yellow-600 mr-3"></i>
            <div>
                <h3 class="text-sm font-medium text-yellow-800">使用限制提醒</h3>
                <p class="text-sm text-yellow-700 mt-1">
                    您本月的DM生成次数已达上限。请升级方案或等待下月重置。
                </p>
            </div>
        </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 左侧：配置面板 -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 sticky top-8">
                <h3 class="text-lg font-bold text-gray-900 mb-6">配置选项</h3>
                
                <!-- 模板选择 -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-3">选择模板</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button 
                            v-for="template in templates" 
                            :key="template.id"
                            @click="selectedTemplate = template.id"
                            :class="selectedTemplate === template.id ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                            class="p-3 rounded-lg text-sm font-medium transition-colors">
                            <i :class="template.icon" class="mr-2"></i>
                            {{ template.name }}
                        </button>
                    </div>
                </div>
                
                <!-- 内容输入 -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">标题</label>
                    <input 
                        type="text" 
                        x-model="form.title"
                        placeholder="输入DM标题"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">内容</label>
                    <textarea 
                        x-model="form.content"
                        rows="4"
                        placeholder="输入DM内容"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">联系信息</label>
                    <input 
                        type="text" 
                        x-model="form.contact"
                        placeholder="输入联系方式"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <!-- 样式选项 -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-3">颜色主题</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button 
                            v-for="color in colorThemes" 
                            :key="color.id"
                            @click="selectedColor = color.id"
                            :class="selectedColor === color.id ? 'ring-2 ring-blue-500' : ''"
                            :style="'background-color: ' + color.primary"
                            class="w-8 h-8 rounded-full border-2 border-white shadow-sm"></button>
                    </div>
                </div>
                
                <!-- 生成按钮 -->
                <button 
                    @click="generateDM"
                    :disabled="loading || usageLimitReached"
                    class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white py-3 px-4 rounded-lg font-medium transition-colors">
                    <i class="fas fa-magic mr-2" :class="{'animate-spin': loading}"></i>
                    <span x-text="loading ? '生成中...' : '生成DM'"></span>
                </button>
                
                <!-- 使用统计 -->
                <div class="mt-4 text-sm text-gray-500 text-center">
                    本月已使用 <span x-text="stats.dm_usage_count || 0"></span> / <span x-text="stats.dm_monthly_limit || 0"></span> 次
                </div>
            </div>
        </div>
        
        <!-- 右侧：预览区域 -->
        <div class="lg:col-span-2">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-bold text-gray-900">预览</h3>
                    <div class="flex space-x-2">
                        <button 
                            @click="downloadDM"
                            :disabled="!generatedDM"
                            class="bg-green-500 hover:bg-green-600 disabled:bg-gray-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                            <i class="fas fa-download mr-1"></i>下载
                        </button>
                        <button 
                            @click="shareDM"
                            :disabled="!generatedDM"
                            class="bg-purple-500 hover:bg-purple-600 disabled:bg-gray-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                            <i class="fas fa-share mr-1"></i>分享
                        </button>
                    </div>
                </div>
                
                <!-- DM预览 -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 min-h-96 flex items-center justify-center">
                    <div x-show="!generatedDM" class="text-center text-gray-500">
                        <i class="fas fa-file-image text-4xl mb-4"></i>
                        <p>配置完成后点击"生成DM"查看预览</p>
                    </div>
                    
                    <div x-show="generatedDM" class="w-full">
                        <!-- 这里将显示生成的DM预览 -->
                        <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
                            <div class="text-center">
                                <h2 class="text-2xl font-bold mb-4" x-text="form.title || 'DM标题'"></h2>
                                <div class="text-gray-700 mb-6" x-text="form.content || 'DM内容'"></div>
                                <div class="text-sm text-gray-500" x-text="form.contact || '联系方式'"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 生成历史 -->
                <div class="mt-8">
                    <h4 class="text-md font-bold text-gray-900 mb-4">最近生成</h4>
                    <div class="space-y-3">
                        <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                            <i class="fas fa-file-image text-blue-600 mr-3"></i>
                            <div class="flex-1">
                                <p class="text-sm font-medium text-gray-900">DM模板 - 营销版</p>
                                <p class="text-xs text-gray-500">2024-01-15 14:30</p>
                            </div>
                            <button class="text-blue-600 hover:text-blue-800 text-sm">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                        
                        <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                            <i class="fas fa-file-image text-green-600 mr-3"></i>
                            <div class="flex-1">
                                <p class="text-sm font-medium text-gray-900">DM模板 - 活动版</p>
                                <p class="text-xs text-gray-500">2024-01-14 10:15</p>
                            </div>
                            <button class="text-blue-600 hover:text-blue-800 text-sm">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function dmGenerator() {
    return {
        form: {
            title: '',
            content: '',
            contact: ''
        },
        selectedTemplate: 'marketing',
        selectedColor: 'blue',
        generatedDM: false,
        loading: false,
        stats: {},
        usageLimitReached: false,
        
        templates: [
            { id: 'marketing', name: '营销', icon: 'fas fa-bullhorn' },
            { id: 'event', name: '活动', icon: 'fas fa-calendar' },
            { id: 'product', name: '产品', icon: 'fas fa-box' },
            { id: 'service', name: '服务', icon: 'fas fa-cog' }
        ],
        
        colorThemes: [
            { id: 'blue', primary: '#3B82F6' },
            { id: 'green', primary: '#10B981' },
            { id: 'purple', primary: '#8B5CF6' },
            { id: 'red', primary: '#EF4444' }
        ],
        
        async init() {
            await this.loadStats();
        },
        
        async loadStats() {
            try {
                const response = await fetch('/api/user/stats');
                const data = await response.json();
                this.stats = data;
                this.usageLimitReached = data.dm_usage_count >= data.dm_monthly_limit;
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        },
        
        async generateDM() {
            if (this.usageLimitReached) {
                showToast('本月DM生成次数已达上限', 'warning');
                return;
            }
            
            this.loading = true;
            
            try {
                const response = await fetch('/api/dm/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        template: this.selectedTemplate,
                        color: this.selectedColor,
                        ...this.form
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    this.generatedDM = true;
                    showToast('DM生成成功！', 'success');
                    await this.loadStats(); // 重新加载统计数据
                } else {
                    showToast(data.error || '生成失败', 'error');
                }
            } catch (error) {
                showToast('网络错误，请稍后重试', 'error');
            } finally {
                this.loading = false;
            }
        },
        
        downloadDM() {
            if (!this.generatedDM) return;
            
            // 这里实现下载逻辑
            showToast('下载功能开发中...', 'info');
        },
        
        shareDM() {
            if (!this.generatedDM) return;
            
            // 这里实现分享逻辑
            showToast('分享功能开发中...', 'info');
        }
    }
}
</script>
{% endblock %}
