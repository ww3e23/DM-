{% extends "base.html" %}

{% block title %}登录 - 整合平台{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-blue-100">
                <i class="fas fa-cube text-blue-600 text-2xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                登录您的账户
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                还没有账户？
                <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">
                    立即注册
                </a>
            </p>
        </div>
        
        <form class="mt-8 space-y-6" x-data="loginForm()">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">用户名</label>
                    <input id="username" name="username" type="text" required 
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                           placeholder="用户名" x-model="form.username">
                </div>
                <div>
                    <label for="password" class="sr-only">密码</label>
                    <input id="password" name="password" type="password" required 
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                           placeholder="密码" x-model="form.password">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                        记住我
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
                        忘记密码？
                    </a>
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50"
                        :disabled="loading"
                        @click="handleLogin">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-sign-in-alt text-blue-500 group-hover:text-blue-400" :class="{'animate-spin': loading}"></i>
                    </span>
                    <span x-text="loading ? '登录中...' : '登录'"></span>
                </button>
            </div>
            
            <!-- 错误信息 -->
            <div x-show="error" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span x-text="error"></span>
            </div>
        </form>
        
        <!-- 演示账户信息 -->
        <div class="mt-8 bg-blue-50 border border-blue-200 rounded-md p-4">
            <h3 class="text-sm font-medium text-blue-800 mb-2">演示账户</h3>
            <div class="text-sm text-blue-700">
                <p><strong>管理员：</strong> admin / admin123</p>
                <p><strong>普通用户：</strong> user / user123</p>
            </div>
        </div>
    </div>
</div>

<script>
function loginForm() {
    return {
        form: {
            username: '',
            password: ''
        },
        loading: false,
        error: '',
        
        async handleLogin(e) {
            e.preventDefault();
            this.loading = true;
            this.error = '';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(this.form)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('登录成功！', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard';
                    }, 1000);
                } else {
                    this.error = data.error || '登录失败';
                }
            } catch (error) {
                this.error = '网络错误，请稍后重试';
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
