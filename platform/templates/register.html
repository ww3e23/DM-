{% extends "base.html" %}

{% block title %}注册 - 整合平台{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-blue-100">
                <i class="fas fa-user-plus text-blue-600 text-2xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                创建新账户
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                已有账户？
                <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">
                    立即登录
                </a>
            </p>
        </div>
        
        <form class="mt-8 space-y-6" x-data="registerForm()">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">用户名</label>
                    <input id="username" name="username" type="text" required 
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                           placeholder="请输入用户名" x-model="form.username">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">邮箱</label>
                    <input id="email" name="email" type="email" required 
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                           placeholder="请输入邮箱地址" x-model="form.email">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
                    <input id="password" name="password" type="password" required 
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                           placeholder="请输入密码" x-model="form.password">
                </div>
                
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700">确认密码</label>
                    <input id="confirm-password" name="confirm-password" type="password" required 
                           class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                           placeholder="请再次输入密码" x-model="form.confirmPassword">
                </div>
            </div>

            <div class="flex items-center">
                <input id="agree-terms" name="agree-terms" type="checkbox" required
                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                       x-model="form.agreeTerms">
                <label for="agree-terms" class="ml-2 block text-sm text-gray-900">
                    我同意
                    <a href="#" class="text-blue-600 hover:text-blue-500">服务条款</a>
                    和
                    <a href="#" class="text-blue-600 hover:text-blue-500">隐私政策</a>
                </label>
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50"
                        :disabled="loading"
                        @click="handleRegister">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-user-plus text-blue-500 group-hover:text-blue-400" :class="{'animate-spin': loading}"></i>
                    </span>
                    <span x-text="loading ? '注册中...' : '创建账户'"></span>
                </button>
            </div>
            
            <!-- 错误信息 -->
            <div x-show="error" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span x-text="error"></span>
            </div>
            
            <!-- 成功信息 -->
            <div x-show="success" class="bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-md">
                <i class="fas fa-check-circle mr-2"></i>
                <span x-text="success"></span>
            </div>
        </form>
        
        <!-- 注册福利 -->
        <div class="mt-8 bg-green-50 border border-green-200 rounded-md p-4">
            <h3 class="text-sm font-medium text-green-800 mb-2">注册即享福利</h3>
            <ul class="text-sm text-green-700 space-y-1">
                <li><i class="fas fa-gift mr-2"></i>免费获得10次DM生成额度</li>
                <li><i class="fas fa-gift mr-2"></i>免费获得50次QR生成额度</li>
                <li><i class="fas fa-gift mr-2"></i>永久保存生成的文件</li>
                <li><i class="fas fa-gift mr-2"></i>优先客服支持</li>
            </ul>
        </div>
    </div>
</div>

<script>
function registerForm() {
    return {
        form: {
            username: '',
            email: '',
            password: '',
            confirmPassword: '',
            agreeTerms: false
        },
        loading: false,
        error: '',
        success: '',
        
        async handleRegister(e) {
            e.preventDefault();
            this.loading = true;
            this.error = '';
            this.success = '';
            
            // 验证密码
            if (this.form.password !== this.form.confirmPassword) {
                this.error = '两次输入的密码不一致';
                this.loading = false;
                return;
            }
            
            // 验证密码长度
            if (this.form.password.length < 6) {
                this.error = '密码长度至少6位';
                this.loading = false;
                return;
            }
            
            // 验证同意条款
            if (!this.form.agreeTerms) {
                this.error = '请同意服务条款和隐私政策';
                this.loading = false;
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: this.form.username,
                        email: this.form.email,
                        password: this.form.password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    this.success = '注册成功！正在跳转...';
                    showToast('注册成功！', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard';
                    }, 1000);
                } else {
                    this.error = data.error || '注册失败';
                }
            } catch (error) {
                this.error = '网络错误，请稍后重试';
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
